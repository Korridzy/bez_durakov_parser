[database]
# Acceptance lane on the throwaway PostgreSQL declared in webreport/docker-compose.test.yml.
url = "postgresql+psycopg://fixture:fixture@postgres_test:5432/fixture"
docker_url = "postgresql+psycopg://fixture:fixture@postgres_test:5432/fixture"
sqlalchemy_logging = false

[application]
debug = true
log_level = "INFO"
default_game_date = "02.03.2022"

[webreport]
backend_port = 28000
frontend_port = 28501
allowed_origins = ["http://localhost:28501", "http://127.0.0.1:28501"]
debug = false
reload = false
backend_debug_port = 5678
frontend_debug_port = 5679
agent_recursion_limit = 8
agent_timeout_seconds = 60
chat_request_timeout_seconds = 150
agent_max_rows_per_fetch = 256
agent_max_rows_per_run = 1024
checkpoint_ttl_seconds = 3600
checkpoint_db_path = "/tmp/test-checkpoints.db"
litellm_base_url = "http://litellm:4000"
agent_model = "gpt-4o"
probe_retry_attempts = 1
probe_retry_delay_seconds = 1
probe_request_timeout_seconds = 5
llm_max_retries = 0
llm_request_timeout_seconds = 60

[dataset]
tools_module = "acceptance_fixture"
knowledge_dir = "/app/acceptance_knowledge"

[xlsm_fetch]
google_drive_folder_url = "https://drive.google.com/drive/folders/[FOLDER_ID]?usp=sharing"
modes = ["browser_selenium"]
download_dir = "xlsm_archive"
