name: Release promotion

on:
  release:
    types: [published]
  # BOOTSTRAP: a v* tag push promotes only the commit named by vars.BD_ROLLOUT_BOOTSTRAP;
  # release: published stays the steady-state path. Remove after the first rollout.
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to promote
        required: true
        type: string

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }} # BOOTSTRAP: ref_name for tag pushes
  cancel-in-progress: false

jobs:
  promote:
    # BOOTSTRAP: each event is named first, because a push payload has no release object; the
    # push clause is the bootstrap and runs only for the commit in vars.BD_ROLLOUT_BOOTSTRAP.
    if: >-
      (github.event_name == 'release' && github.event.release.prerelease == false &&
       github.event.release.draft == false) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.BD_ROLLOUT_BOOTSTRAP == github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      BD_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }} # BOOTSTRAP: ref_name for tag pushes
      # BOOTSTRAP: begin opt-in for promote.sh. It is set for every event whose commit equals the
      # variable, so a release: published run for the same commit also takes the bootstrap gate
      # instead of being refused as not on main; a second promotion of identical digests and
      # metadata is an idempotent no-op. Unset or another commit keeps the default main gate.
      BD_PROMOTE_BOOTSTRAP_COMMIT: ${{ vars.BD_ROLLOUT_BOOTSTRAP == github.sha && github.sha || '' }}
      BD_PROMOTE_BOOTSTRAP_BRANCH: issue-96-deploy-webreport-via-versioned-ci-cd-and-close-public-db-access
      # BOOTSTRAP: end
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$BD_RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'E_INVALID_TAG: expected vMAJOR.MINOR.PATCH' >&2
            exit 1
          fi
      # BOOTSTRAP: begin. A tag push can start before its Release exists; wait a bounded time.
      - name: Wait for the stable release (bootstrap)
        if: github.event_name == 'push'
        shell: bash
        run: |
          for _ in $(seq 1 30); do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$BD_RELEASE_TAG" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::no release named $BD_RELEASE_TAG after 5 minutes; publish it, then re-run this workflow run" >&2
          exit 1
      # BOOTSTRAP: end
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.BD_RELEASE_TAG }}
          fetch-depth: 0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install Poetry
        run: pipx install poetry==2.1.3
      - name: Promote tested candidates
        run: bash deploy/promote.sh
