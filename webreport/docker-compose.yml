x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${BD_LOG_ROTATION_MAX_SIZE:-10m}"
    max-file: "${BD_LOG_ROTATION_MAX_FILES:-3}"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: .env.mysql
        required: false
    ports:
      - "127.0.0.1:${BD_MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - ${BD_VM_DIR:-../vm}/mysql/mysql_data:/var/lib/mysql
    networks:
      - webreport-network
    command: --default-authentication-plugin=mysql_native_password

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file:
      - path: .env.litellm
        required: false
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
      - ./litellm_settings.generated.yaml:/app/litellm_settings.generated.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - webreport-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3).status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 120s
    restart: unless-stopped
    logging: *default-logging

  backend:
    build:
      context: ..
      dockerfile: webreport/Dockerfile.backend
    ports:
      - "${WEBREPORT_BACKEND_PORT}:8000"
    env_file:
      - path: .env.backend
        required: false
    environment:
      BD_REQUIRE_MYSQL: ${BD_REQUIRE_MYSQL:-}
    volumes:
      - ./backend:/app
      - ../bd_shared:/bd_shared:ro
      - ${BD_VM_DIR:-../vm}/backend/checkpoints:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - webreport-network
    depends_on:
      mysql:
        condition: service_started
      litellm:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  data_collector:
    build:
      context: ..
      dockerfile: webreport/Dockerfile.data_collector
    command: python entrypoint.py
    init: true
    stop_grace_period: 1200s
    env_file:
      - path: .env.data_collector
        required: false
    volumes:
      - ./data_collector:/app
      - ../bd_shared:/bd_shared:ro
      - ${BD_XLSM_ARCHIVE_DIR:-../xlsm_archive}:/app/xlsm_archive
    depends_on:
      - mysql
    networks:
      - webreport-network
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: ..
      dockerfile: webreport/Dockerfile.frontend
    ports:
      - "${WEBREPORT_FRONTEND_PORT}:8501"
    depends_on:
      - backend
    networks:
      - webreport-network
    restart: unless-stopped
    logging: *default-logging

networks:
  webreport-network:
    driver: bridge
