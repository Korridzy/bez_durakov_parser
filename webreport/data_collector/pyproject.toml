[tool.poetry]
name = "data-collector"
version = "0.1.0"
description = "Scheduled XLSM fetch service"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
selenium = "*"
pymysql = "*"
sqlalchemy = "*"
openpyxl = "*"
requests = "*"
gdown = "*"
apscheduler = ">=3.0,<4.0"
pandas = "*"
numpy = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
