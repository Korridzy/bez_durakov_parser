[tool.poetry]
name = "data-collector"
version = "0.1.0"
description = "Scheduled XLSM fetch service"
authors = [
    "Korridzy <korridzy.pub@gmail.com>"
]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
selenium = ">=4.35.0,<5.0.0"
pymysql = ">=1.1.1,<2.0.0"
sqlalchemy = ">=2.0.41,<3.0.0"
openpyxl = ">=3.1.5,<4.0.0"
requests = ">=2.31.0,<3.0.0"
gdown = ">=5.2.0,<6.0.0"
apscheduler = ">=3.0,<4.0"
pandas = ">=2.3.1,<3.0.0"
numpy = ">=2.3.1,<3.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
