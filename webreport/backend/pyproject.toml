[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "webreport-backend"
version = "1.0.0"
description = "Backend API for game data reporting system"
authors = [
    "Korridzy <korridzy.pub@gmail.com>"
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = ">=0.104.0"
uvicorn = {extras = ["standard"], version = ">=0.24.0"}
pydantic = ">=2.0.0"
python-dotenv = ">=1.0.0"
pandas = ">=2.0.0"
sqlalchemy = ">=2.0.0"
pymysql = {extras = ["rsa"], version = ">=1.1.0"}
psycopg = {extras = ["binary"], version = ">=3.2,<4"}
langgraph = ">=1.0"
langchain-litellm = {version = ">=0.7,<0.8", python = "<3.15"}
langgraph-checkpoint = ">=3.0"
langgraph-checkpoint-sqlite = ">=3.0"
pydevd-pycharm = "~=252.27397.106"
requests = ">=2.31.0"
