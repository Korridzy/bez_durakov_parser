# Схема:
# Корневой ключ dataset задаёт набор данных.
# Каждый элемент [[cases]] содержит краткий id, category и массив turns.
# Каждый [[cases.turns]] содержит собственный краткий id, сообщение message и
# непустой список acceptable_verdicts. Поле borderline = true отмечает единственный
# пограничный ход с несколькими допустимыми вердиктами. В таблице драйвер выводит пару id случая и id хода.
# Одиночный случай содержит один ход. Многоходовой случай имеет category = "multi_turn"
# и от двух до трёх ходов.

dataset = "bez_durakov"

[[cases]]
id = "rel_dates"
category = "relevant"

[[cases.turns]]
id = "rel_dates_1"
message = "Какие даты игр клуба «Без дураков» есть в базе?"
acceptable_verdicts = ["in_scope"]

